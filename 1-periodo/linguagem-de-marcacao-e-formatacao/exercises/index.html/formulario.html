<!DOCTYPE html>
<html lang="pt-BR">
    <body>
        <h1>Formulário de Cadastro</h1>
        <h2>Início do formulário</h2>
        <form action="method"="post">
            Informe seu nome completo:<br/>
            <input type="text" name="Nome" id="nome"><br/>
            Selecione o tipo de combustível:<br/>
            <input type="radio" name="gas" id="gas">Gasolina<br/>
            <input type="radio" name="gvn" id="gvn">GVN<br/>
            <input type="radio" name="flex" id="flex">Flex<br/>

        </form>
    </body>
    <form action="method"="get">

        Selecione o combustível:<br/>
        <input type="checkbox" name="gas" id="gas" volue="gas"/>Gasolina<br/>
        <input type="checkbox" name="alc" id="alc" volue="alc"/>Alcool<br/>
        <input type="checkbox" name="gnv" id="gnv" volue="gnv"/>GNV<br/>
        <input type="checkbox" name="flex" id="flex" volue="flex"/>Flexbr/>

        Escolha o fabricante do carro:<br/>
        <select name="car" id="car">
            <option value="Fiat">Fiat</option>
            <option value="Hyundai">Hyundai</option>
            <option value="BYD">BYD</option>
            <option value="Honda" selected >Honda</option>
        </select>
        <br/>
        Sugestão:<br/>
        <textarea name="dica" id"dica" cols="30" rows="10"></textarea>

        <br/>Data Cadastro:
        <input type="date" name="dt_cad" id="dt_cad" />
        <br/>
        E-mail:
        <br/>
        <input typr="email" name="email" id="email" required>
        <br/>
        <input type="reset" value="limpar" />
        <input type="submit" value="enviar" />
        
    </form>
</html>
